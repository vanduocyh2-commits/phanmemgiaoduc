services:
  - type: web
    name: phanmemgiaoduc
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm install --omit=dev && npm test
    startCommand: node portal-server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
