name: VPS source snapshot (read only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/vps-source-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main source for comparison
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Copy live source files and read-only diagnostics from VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_key"
          chmod 600 "$RUNNER_TEMP/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null

          ssh -i "$RUNNER_TEMP/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            for f in portal-server.mjs teacher-tools.mjs public/index.html; do
              test -r "/opt/phanmemgiaoduc/$f"
            done
            {
              echo "=== VPS deployment diagnostic (read-only) ==="
              date -Is
              hostname
              echo
              echo "=== Production code file metadata ==="
              for f in portal-server.mjs teacher-tools.mjs public/index.html; do
                stat -c "%n size=%s bytes mtime=%y" "/opt/phanmemgiaoduc/$f"
                sha256sum "/opt/phanmemgiaoduc/$f"
              done
              echo
              echo "=== Clean checkout ownership ==="
              stat -c "%A %U:%G %n" /opt/phanmemgiaoduc-git-clean /opt/phanmemgiaoduc-git-clean/.git 2>&1 || true
              stat -c "%A %U:%G %n" /opt/phanmemgiaoduc-git-clean/portal-server.mjs 2>&1 || true
              git -C /opt/phanmemgiaoduc-git-clean rev-parse HEAD 2>&1 || true
              echo
              echo "=== Production Git metadata diagnostic ==="
              git -C /opt/phanmemgiaoduc rev-parse HEAD 2>&1 || true
              git -C /opt/phanmemgiaoduc status --short 2>&1 || true
              echo
              echo "=== SSH account and permissions ==="
              id 2>&1 || true
              groups 2>&1 || true
              for p in /opt/phanmemgiaoduc /opt/phanmemgiaoduc/.git /opt/phanmemgiaoduc/portal-server.mjs /opt/phanmemgiaoduc/teacher-tools.mjs /opt/phanmemgiaoduc/public/index.html /opt/phanmemgiaoduc-git-clean /opt/phanmemgiaoduc-git-clean/.git /usr/local/sbin/phanmemgiaoduc-deploy; do
                stat -c "%A %U:%G %n" "$p" 2>&1 || true
                test -w "$p" && echo "WRITABLE $p" || echo "NOT_WRITABLE $p"
              done
              echo
              echo "=== Clean checkout as centerapp ==="
              sudo -n -u centerapp git -C /opt/phanmemgiaoduc-git-clean rev-parse HEAD 2>&1 || true
              sudo -n -u centerapp git -C /opt/phanmemgiaoduc-git-clean status --short 2>&1 || true
              sudo -n -u centerapp git -C /opt/phanmemgiaoduc-git-clean remote get-url origin 2>&1 || true
              sudo -n -u centerapp git -C /opt/phanmemgiaoduc-git-clean ls-files -z > /tmp/phanmemgiaoduc-clean-tracked.bin 2>/tmp/phanmemgiaoduc-clean-tracked.err || true
              python3 - <<'PY'
from pathlib import Path
root=Path('/opt/phanmemgiaoduc')
clean=Path('/opt/phanmemgiaoduc-git-clean')
try:
    names=Path('/tmp/phanmemgiaoduc-clean-tracked.bin').read_bytes().split(b'\\0')
    changed=[]
    missing=[]
    for raw in filter(None,names):
        rel=raw.decode('utf-8','surrogateescape')
        a=root/rel
        b=clean/rel
        if not b.exists():
            missing.append(rel)
        elif not a.exists() or a.read_bytes()!=b.read_bytes():
            changed.append(rel)
    print('TRACKED_FILES_COMPARED',len(list(filter(None,names))))
    print('DIFFERENT_FROM_CLEAN',len(changed))
    print('MISSING_IN_PRODUCTION',len(missing))
    for x in changed[:200]: print('DIFF',x)
    for x in missing[:200]: print('MISSING',x)
except Exception as e:
    print('COMPARE_ERROR',repr(e))
PY
              echo
              echo "=== Sudo permissions available to deploy account ==="
              sudo -n -l 2>&1 || true
              echo
              echo "=== Centerapp write permissions and clean Git ==="
              sudo -n -u centerapp sh -c 'id; for p in /opt/phanmemgiaoduc /opt/phanmemgiaoduc/.git /opt/phanmemgiaoduc/portal-server.mjs /opt/phanmemgiaoduc/teacher-tools.mjs /opt/phanmemgiaoduc/public/index.html /opt/phanmemgiaoduc-git-clean /opt/phanmemgiaoduc-git-clean/.git; do test -w "$p" && echo "CENTERAPP_WRITABLE $p" || echo "CENTERAPP_NOT_WRITABLE $p"; done' 2>&1 || true
              sudo -n -u centerapp git -C /opt/phanmemgiaoduc-git-clean rev-parse HEAD 2>&1 || true
              sudo -n -u centerapp git -C /opt/phanmemgiaoduc-git-clean status --short 2>&1 || true
              echo
              echo "=== Production Git metadata as centerapp ==="
              sudo -n -u centerapp git -C /opt/phanmemgiaoduc rev-parse HEAD 2>&1 || true
              sudo -n -u centerapp git -C /opt/phanmemgiaoduc branch --show-current 2>&1 || true
              echo
              echo "=== Deployment script permissions ==="
              stat -c "%A %U:%G %n" /usr/local/sbin/phanmemgiaoduc-deploy 2>&1 || true
              echo
              echo "=== Running service ==="
              systemctl is-active phanmemgiaoduc.service 2>&1 || true
              systemctl show -p ExecStart phanmemgiaoduc.service 2>&1 || true
            } > /tmp/phanmemgiaoduc-vps-deploy-diagnostic.txt 2>&1
          '

          mkdir -p snapshot/production/public snapshot/github/public snapshot/github/ops
          scp -i "$RUNNER_TEMP/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST:/opt/phanmemgiaoduc/portal-server.mjs" snapshot/production/
          scp -i "$RUNNER_TEMP/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST:/opt/phanmemgiaoduc/teacher-tools.mjs" snapshot/production/
          scp -i "$RUNNER_TEMP/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST:/opt/phanmemgiaoduc/public/index.html" snapshot/production/public/
          scp -i "$RUNNER_TEMP/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST:/tmp/phanmemgiaoduc-vps-deploy-diagnostic.txt" snapshot/
          scp -i "$RUNNER_TEMP/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST:/usr/local/sbin/phanmemgiaoduc-deploy" snapshot/production/

          cp portal-server.mjs snapshot/github/
          cp teacher-tools.mjs snapshot/github/
          cp public/index.html snapshot/github/public/
          cp ops/phanmemgiaoduc-deploy.sh snapshot/github/ops/

          rm -f "$RUNNER_TEMP/vps_key"

      - name: Upload production snapshot for review
        uses: actions/upload-artifact@v4
        with:
          name: vps-source-review-snapshot
          path: snapshot/
          if-no-files-found: error
          retention-days: 2
