name: VPS source snapshot (read only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/vps-source-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy source review archive and deployment diagnostics from VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_key"
          chmod 600 "$RUNNER_TEMP/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null

          ssh -i "$RUNNER_TEMP/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            SRC=/root/phanmemgiaoduc-code-review.zip
            TMP=/tmp/phanmemgiaoduc-code-review-gha.zip
            DIAG=/tmp/phanmemgiaoduc-vps-deploy-diagnostic.txt

            if test -r "$SRC"; then
              cp "$SRC" "$TMP"
            else
              sudo -n install -m 0644 "$SRC" "$TMP"
            fi
            chmod 0644 "$TMP"

            {
              echo "=== VPS deployment diagnostic (read-only) ==="
              date -Is
              hostname
              echo
              echo "=== Production code files ==="
              for f in portal-server.mjs teacher-tools.mjs public/index.html; do
                if test -f "/opt/phanmemgiaoduc/$f"; then
                  stat -c "%n size=%s bytes mtime=%y" "/opt/phanmemgiaoduc/$f"
                  sha256sum "/opt/phanmemgiaoduc/$f"
                else
                  echo "MISSING /opt/phanmemgiaoduc/$f"
                fi
              done
              echo
              echo "=== Clean checkout ==="
              git -C /opt/phanmemgiaoduc-git-clean rev-parse HEAD 2>&1 || true
              git -C /opt/phanmemgiaoduc-git-clean status --short 2>&1 || true
              echo
              echo "=== Production Git metadata diagnostic ==="
              git -C /opt/phanmemgiaoduc rev-parse HEAD 2>&1 || true
              git -C /opt/phanmemgiaoduc status --short 2>&1 || true
              echo
              echo "=== Deploy script (sensitive assignment lines omitted) ==="
              if test -r /usr/local/sbin/phanmemgiaoduc-deploy; then
                sed -E "/(PASSWORD|TOKEN|SECRET|PRIVATE|DATABASE_URL|SUPABASE|SSH_KEY|API_KEY)/Id" /usr/local/sbin/phanmemgiaoduc-deploy
              else
                sudo -n sh -c "sed -E \"/(PASSWORD|TOKEN|SECRET|PRIVATE|DATABASE_URL|SUPABASE|SSH_KEY|API_KEY)/Id\" /usr/local/sbin/phanmemgiaoduc-deploy" 2>&1 || true
              fi
              echo
              echo "=== Backup directory ==="
              ls -ld /root/phanmemgiaoduc-localchanges-20261113-022233 2>&1 || true
              ls -lh /root/phanmemgiaoduc-localchanges-20261113-022233 2>&1 || true
              echo
              echo "=== Running service ==="
              systemctl is-active phanmemgiaoduc.service 2>&1 || true
              systemctl show -p ExecStart phanmemgiaoduc.service 2>&1 || true
            } > "$DIAG" 2>&1
            chmod 0644 "$DIAG"
          '

          scp -i "$RUNNER_TEMP/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST:/tmp/phanmemgiaoduc-code-review-gha.zip" "$RUNNER_TEMP/phanmemgiaoduc-code-review.zip"
          scp -i "$RUNNER_TEMP/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST:/tmp/phanmemgiaoduc-vps-deploy-diagnostic.txt" "$RUNNER_TEMP/phanmemgiaoduc-vps-deploy-diagnostic.txt"
          mkdir -p snapshot
          cp "$RUNNER_TEMP/phanmemgiaoduc-code-review.zip" snapshot/
          cp "$RUNNER_TEMP/phanmemgiaoduc-vps-deploy-diagnostic.txt" snapshot/
          rm -f "$RUNNER_TEMP/vps_key"

      - name: Upload snapshot for review
        uses: actions/upload-artifact@v4
        with:
          name: vps-source-review-snapshot
          path: snapshot/
          if-no-files-found: error
          retention-days: 2
