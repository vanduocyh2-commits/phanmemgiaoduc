name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy reviewed source and AI lesson modules
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            RAW="https://raw.githubusercontent.com/vanduocyh2-commits/phanmemgiaoduc/${{ github.sha }}"
            STAGE="$(mktemp -d /tmp/phanmemgiaoduc-center-year.XXXXXX)"
            trap 'rm -rf "$STAGE"' EXIT
            curl -fsSL --retry 2 --connect-timeout 10 --max-time 120 "$RAW/center-academic-year.mjs" -o "$STAGE/center-academic-year.mjs"
            curl -fsSL --retry 2 --connect-timeout 10 --max-time 120 "$RAW/public/center-academic-year-ui.mjs" -o "$STAGE/center-academic-year-ui.mjs"
            node --check "$STAGE/center-academic-year.mjs"
            node --check "$STAGE/center-academic-year-ui.mjs"
            sudo -n install -o centerapp -g centerapp -m 0644 "$STAGE/center-academic-year.mjs" /opt/phanmemgiaoduc/center-academic-year.mjs
            sudo -n install -o centerapp -g centerapp -m 0644 "$STAGE/center-academic-year-ui.mjs" /opt/phanmemgiaoduc/public/center-academic-year-ui.mjs
            echo "CENTER_ACADEMIC_YEAR_MODULES_INSTALLED"
            echo "=== Deploying reviewed commit ${{ github.sha }} ==="
            sudo -n /usr/local/sbin/phanmemgiaoduc-ai-modules-deploy '${{ github.sha }}'
            echo "=== Verifying portal service health ==="
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3000/api/health; then
                echo
                echo "PORTAL_HEALTH_CHECK_SUCCESS"
                exit 0
              fi
              sleep 2
            done
            echo "ERROR: portal health endpoint did not become ready" >&2
            sudo -n systemctl is-active phanmemgiaoduc.service >&2 || true
            sudo -n journalctl -u phanmemgiaoduc.service -n 40 --no-pager >&2 || true
            exit 1
