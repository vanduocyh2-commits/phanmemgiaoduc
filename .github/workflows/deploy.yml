name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy reviewed source with the authorized source deploy helper
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            SHA="${{ github.sha }}"
            echo "=== Preflight existing center academic-year modules ==="
            for file in /opt/phanmemgiaoduc/center-academic-year.mjs /opt/phanmemgiaoduc/student-sbd.mjs /opt/phanmemgiaoduc/public/center-academic-year-ui.mjs; do
              if [[ -s "$file" ]]; then echo "MODULE_PRESENT $file"; ls -l "$file"; else echo "MODULE_MISSING $file"; fi
            done
            exit 42
            echo "=== Deploying reviewed commit $SHA through the authorized source deploy helper ==="
            sudo -n /usr/local/sbin/phanmemgiaoduc-source-deploy "$SHA"
            echo "=== Verifying portal service health ==="
            for attempt in {1..20}; do
              if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3000/api/health; then
                echo
                echo "PORTAL_HEALTH_CHECK_SUCCESS"
                exit 0
              fi
              sleep 2
            done
            echo "ERROR: portal health endpoint did not become ready" >&2
            sudo -n systemctl is-active phanmemgiaoduc.service >&2 || true
            sudo -n journalctl -u phanmemgiaoduc.service -n 50 --no-pager >&2 || true
            exit 1
