name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "=== VPS working tree preflight ==="
            git -C /opt/phanmemgiaoduc status --short || true
            git -C /opt/phanmemgiaoduc diff --stat || true
            git -C /opt/phanmemgiaoduc diff --cached --stat || true
            echo "=== Starting guarded deployment ==="
            sudo -n /usr/local/sbin/phanmemgiaoduc-deploy
