name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy reviewed source files to VPS with backup and rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "=== Deploying reviewed GitHub commit to VPS ==="
            sudo -n /usr/local/sbin/phanmemgiaoduc-source-deploy '${{ github.sha }}'
            echo "=== Verifying portal service health ==="
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3000/api/health; then
                echo
                echo "PORTAL_HEALTH_CHECK_SUCCESS"
                exit 0
              fi
              sleep 2
            done
            echo "ERROR: portal health endpoint did not become ready" >&2
            sudo -n systemctl is-active phanmemgiaoduc.service >&2 || true
            sudo -n journalctl -u phanmemgiaoduc.service -n 40 --no-pager >&2 || true
            exit 1
