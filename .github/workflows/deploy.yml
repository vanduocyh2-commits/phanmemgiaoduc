name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployment account safely
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            echo "REMOTE_ID"
            id
            echo "SUDO_RULES"
            sudo -n -l || true
            echo "REPO_PERMISSIONS"
            ls -ld /opt/phanmemgiaoduc /opt/phanmemgiaoduc/.git /opt/phanmemgiaoduc-backups 2>&1 || true
            echo "GIT_STATUS"
            runuser -u centerapp -- git -C /opt/phanmemgiaoduc status --short 2>&1 || true
