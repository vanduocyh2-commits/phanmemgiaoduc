name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy reviewed source with the authorized source deploy helper
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            SHA="${{ github.sha }}"
            echo "=== Preflight SBD support module ==="
            test -s /opt/phanmemgiaoduc/student-sbd.mjs
            node --check /opt/phanmemgiaoduc/student-sbd.mjs
            echo "STUDENT_SBD_MODULE_READY"
            echo "=== Deploying reviewed commit $SHA through authorized source deploy ==="
            sudo -n /usr/local/sbin/phanmemgiaoduc-source-deploy "$SHA"
            echo "=== Verifying portal service health ==="
            READY=0
            for attempt in {1..20}; do
              if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3000/api/health; then
                echo
                echo "PORTAL_HEALTH_CHECK_SUCCESS"
                READY=1
                break
              fi
              sleep 2
            done
            if [ "$READY" -ne 1 ]; then
              echo "ERROR: portal health endpoint did not become ready" >&2
              sudo -n systemctl is-active phanmemgiaoduc.service >&2 || true
              sudo -n journalctl -u phanmemgiaoduc.service -n 50 --no-pager >&2 || true
              exit 1
            fi
            echo "=== Diagnosing the exact page file used by the running Node process ==="
            APP_PID="$(systemctl show -p MainPID --value phanmemgiaoduc.service)"
            echo "SERVICE_MAINPID=$APP_PID"
            sudo -n ss -ltnp 2>/dev/null | grep ':3000' || true
            sudo -n ps -eo pid,ppid,user,args | grep -E '[n]ode|[p]ortal-server' || true
            if [ -n "$APP_PID" ] && [ "$APP_PID" != "0" ]; then
              echo "PROCESS_CMDLINE=$(tr '\0' ' ' < "/proc/$APP_PID/cmdline")"
              echo "PROCESS_CWD=$(readlink -f "/proc/$APP_PID/cwd")"
              echo "PROCESS_ROOT=$(readlink -f "/proc/$APP_PID/root")"
              echo "PROCESS_MOUNT_NS=$(readlink "/proc/$APP_PID/ns/mnt" || true)"
              echo "HOST_MOUNT_NS=$(readlink "/proc/1/ns/mnt" || true)"
              PROC_INDEX="/proc/$APP_PID/root/opt/phanmemgiaoduc/public/index.html"
              PROC_SERVER="/proc/$APP_PID/root/opt/phanmemgiaoduc/portal-server.mjs"
              ls -l "$PROC_INDEX" "$PROC_SERVER" || true
              sha256sum "$PROC_INDEX" "$PROC_SERVER" 2>/dev/null || true
              for marker in fee-open-full-button fee-payment-amount; do
                if grep -Fq "$marker" "$PROC_INDEX"; then
                  echo "PROCESS_VIEW_HAS_MARKER=$marker"
                else
                  echo "PROCESS_VIEW_MISSING_MARKER=$marker"
                fi
              done
            fi
            REAL_SERVER="$(readlink -f /opt/phanmemgiaoduc/portal-server.mjs)"
            REAL_INDEX="$(dirname "$REAL_SERVER")/public/index.html"
            echo "REAL_SERVER=$REAL_SERVER"
            echo "REAL_INDEX=$REAL_INDEX"
            ls -l /opt/phanmemgiaoduc/public/index.html "$REAL_INDEX" || true
            sha256sum /opt/phanmemgiaoduc/public/index.html "$REAL_INDEX" 2>/dev/null || true
            for marker in fee-open-full-button fee-payment-amount 'Xem toàn bộ học phí'; do
              if grep -Fq "$marker" "$REAL_INDEX"; then
                echo "DISK_HAS_MARKER=$marker"
              else
                echo "DISK_MISSING_MARKER=$marker"
              fi
            done
            echo "DISK_INDEX_BYTES=$(wc -c < "$REAL_INDEX")"
            echo "=== Verifying the tuition-history module actually served by the portal ==="
            HISTORY_UI="$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/admin-tuition-history-ui.mjs)"
            printf '%s' "$HISTORY_UI" | grep -Fq 'window.openStudentFeeHistory' || {
              echo "ERROR: served tuition module is missing the new Xem-to-history handler" >&2
              exit 1
            }
            printf '%s' "$HISTORY_UI" | grep -Fq 'button[data-open-student-fee-history]' || {
              echo "ERROR: served tuition module is missing cleanup for the legacy injected button" >&2
              exit 1
            }
            if printf '%s' "$HISTORY_UI" | grep -Fq "button.textContent='Xem toàn bộ học phí'"; then
              echo "ERROR: served tuition module still injects the duplicate Xem toàn bộ học phí button" >&2
              exit 1
            fi
            grep -Fq "window.openStudentFeeHistory(" /opt/phanmemgiaoduc/public/index.html || {
              echo "ERROR: deployed index does not route the student Xem button to tuition history" >&2
              exit 1
            }
            echo "TUITION_HISTORY_UI_RESPONSE_VERIFIED"
