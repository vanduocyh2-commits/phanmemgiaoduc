name: Check application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev
      - run: node --check server.mjs
      - run: node --check portal-server.mjs
      - run: node --check public/student-visual-math-editor.js
      - run: node --check supabase-store.mjs
      - name: Check inline scripts in public entry
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('public/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>', html, re.I)
          count = 0
          for attrs, script in scripts:
              if re.search(r'\bsrc\s*=', attrs, re.I):
                  continue
              is_module = re.search(r'\btype\s*=\s*["\']module["\']', attrs, re.I)
              suffix = 'mjs' if is_module else 'js'
              count += 1
              Path(f'/tmp/portal-inline-{count}.{suffix}').write_text(script, encoding='utf-8')
          if not count:
              raise SystemExit('No inline scripts found')
          print(f'Extracted {count} inline script(s)')
          PY
          for file in /tmp/portal-inline-*.js /tmp/portal-inline-*.mjs; do node --check $file; done
      - run: npm test

  vps-permissions:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 102
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deploy account and clean checkout access (read-only)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_key"
          chmod 600 "$RUNNER_TEMP/vps_key"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$RUNNER_TEMP/vps_key" -o BatchMode=yes "$VPS_USER@$VPS_HOST" '
            echo "=== SSH identity ==="
            id
            groups
            echo "=== Sudo allow-list ==="
            sudo -n -l 2>&1 || true
            echo "=== Write access as SSH user ==="
            for p in /opt/phanmemgiaoduc /opt/phanmemgiaoduc/.git /opt/phanmemgiaoduc/portal-server.mjs /opt/phanmemgiaoduc/teacher-tools.mjs /opt/phanmemgiaoduc/public/index.html /opt/phanmemgiaoduc-git-clean /opt/phanmemgiaoduc-git-clean/.git /usr/local/sbin/phanmemgiaoduc-deploy; do
              stat -c "%A %U:%G %n" "$p" 2>&1 || true
              if test -w "$p"; then echo "SSH_USER_WRITABLE $p"; else echo "SSH_USER_NOT_WRITABLE $p"; fi
            done
            echo "=== Clean checkout as centerapp ==="
            sudo -n -u centerapp git -C /opt/phanmemgiaoduc-git-clean rev-parse HEAD 2>&1 || true
            sudo -n -u centerapp git -C /opt/phanmemgiaoduc-git-clean status --short 2>&1 || true
            sudo -n -u centerapp git -C /opt/phanmemgiaoduc-git-clean remote get-url origin 2>&1 || true
            echo "=== App root write access as centerapp ==="
            sudo -n -u centerapp test -w /opt/phanmemgiaoduc 2>&1 && echo CENTERAPP_CAN_WRITE_APP_ROOT || echo CENTERAPP_CANNOT_WRITE_APP_ROOT
            sudo -n -u centerapp test -w /opt/phanmemgiaoduc/portal-server.mjs 2>&1 && echo CENTERAPP_CAN_WRITE_PORTAL || echo CENTERAPP_CANNOT_WRITE_PORTAL
            sudo -n -u centerapp test -w /opt/phanmemgiaoduc/.git 2>&1 && echo CENTERAPP_CAN_WRITE_GITDIR || echo CENTERAPP_CANNOT_WRITE_GITDIR
          '
          rm -f "$RUNNER_TEMP/vps_key"
